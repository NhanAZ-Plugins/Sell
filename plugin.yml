name: Sell
api: 5.0.0
main: SellHand\Main
version: 2.1.0
author: [Muqsit, Ghast Noob]
depend: [EconomyAPI]
commands:
  sell:
    description: Sell configured inventory items to EconomyAPI
    usage: /sell <hand|all|about>
    permission: sell

permissions:
  sell:
    description: Allows access to the sell command
    default: true
  sell.hand:
    description: Allows selling the held item
    default: true
  sell.all:
    description: Allows selling all configured items in the inventory
    default: true
